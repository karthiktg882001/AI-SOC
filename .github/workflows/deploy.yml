name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Copy files to server
      run: |
        rsync -avz --exclude '.git' \
          --exclude 'node_modules' \
          --exclude '__pycache__' \
          --exclude '.env' \
          -e ssh \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH || '/opt/aisoc' }}/

    - name: Deploy on server
      run: |
        ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.DEPLOY_PATH || '/opt/aisoc' }}
          
          # Backup current deployment
          if [ -d "backup" ]; then
            rm -rf backup
          fi
          mkdir -p backup
          docker-compose ps > backup/services.txt 2>&1 || true
          
          # Pull latest changes
          git pull origin main || true
          
          # Build and start services
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d
          
          # Wait for services to start
          echo "Waiting for services to start..."
          sleep 30
          
          # Health checks
          echo "Checking service health..."
          docker-compose ps
          
          # Verify services are responding
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done' || echo "Frontend check failed"
          timeout 60 bash -c 'until curl -f http://localhost:8000/docs; do sleep 2; done' || echo "ML Service check failed"
          
          # Cleanup
          docker system prune -f
          
          echo "Deployment completed!"
        EOF

    - name: Deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi

