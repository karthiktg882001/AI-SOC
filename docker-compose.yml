version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - soc-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - soc-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - soc-network

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - soc-network

  log-ingestion-service:
    build:
      context: ./log-ingestion-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - mongodb
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/soc_logs?authSource=admin
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - soc-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - kafka
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc_db
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/soc_logs?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PASSWORD_ENCRYPTION_KEY: lyDnXCe1rz37a0ZNTS-96nUuvzqFVytSnwUaBxWT9e8=
      SECRET_KEY: soc-secret-key-change-in-production-use-strong-random-key
      ABUSEIPDB_API_KEY: ""
      OTX_API_KEY: ""
      VIRUSTOTAL_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    networks:
      - soc-network

  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/soc_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks:
      - soc-network

  automation-service:
    build:
      context: ./automation-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - ml-service
    environment:
      ML_SERVICE_URL: http://ml-service:8000
    networks:
      - soc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - ml-service
      - log-ingestion-service
    environment:
      REACT_APP_API_URL: 
      # REACT_APP_INGESTION_URL removed - use relative paths through nginx proxy
    networks:
      - soc-network

volumes:
  mongodb_data:
  postgres_data:
  neo4j_data:

networks:
  soc-network:
    driver: bridge

